<!doctype html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>AgentLab</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header><b>Agent<span>Lab</span></b><a href="#criar">Criar agente</a></header>
    <main>
        <section class="hero">
            <p>SEU AGENTE. SUAS REGRAS.</p>
            <h1>Crie seu próprio <em>Agente de IA.</em></h1>
            <p>Defina personalidade, objetivo e especialidade para seu assistente inteligente.</p><a class="btn"
                href="#criar">Começar</a>
        </section>
        <section id="criar">
            <h2>Imagine seu agente</h2>
            <form id="f"><input id="n" placeholder="Nome do agente"><select id="r">
                    <option>Dados & Analytics</option>
                    <option>Desenvolvimento</option>
                    <option>Atendimento</option>
                </select><textarea id="m" placeholder="Missão"></textarea><button>Criar perfil</button></form>
            <div id="out">Pronto para configurar.</div>
        </section>
    </main>
    <footer>AgentLab • Docker • Nginx • Jenkins</footer>
    <script src="script.js"></script>
</body>

</html>
