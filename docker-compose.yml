services:
  web:
    image: agentlab:${APP_VERSION:-latest}
    container_name: agentlab-web
    restart: unless-stopped
    networks:
      - agent-network
  proxy:
    image: agentlab-proxy:${APP_VERSION:-latest}
    container_name: agentlab-proxy
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - web
    networks:
      - agent-network
networks:
  agent-network:
    driver: bridge